spring.application.name=sales-dashboard
server.port=8080

# ---- Default storage: file-based H2 (data is kept in ./data/salesdb.mv.db) ----
spring.datasource.url=jdbc:h2:file:./data/salesdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Browse the database at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
